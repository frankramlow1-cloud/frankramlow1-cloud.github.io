name: Apps auspacken
on:
  push:
    paths:
      - 'apps.zip'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  auspacken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP auspacken
        run: |
          set -e
          rm -rf /tmp/z && mkdir /tmp/z
          unzip -q -o apps.zip -d /tmp/z
          cd /tmp/z
          while [ "$(ls -A | wc -l)" = "1" ] && [ -d "$(ls -A)" ] && [ ! -f "$(ls -A)/index.html" ]; do cd "$(ls -A)"; done
          cp -a . "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          touch .nojekyll
          git config user.name "Apps-Helfer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Apps aktualisiert"
          git push
      - name: Seite neu bauen
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
