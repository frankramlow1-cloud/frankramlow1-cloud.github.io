<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PDF-Werkstatt</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0b07">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="docs.js"></script>
<style>
  :root {
    --brass: linear-gradient(150deg, #dcc386 0%, #b38c3e 20%, #74531a 44%, #c3a259 62%, #8a6526 80%, #cfb170 100%);
    --brass-flat: #c79a45;
    --ink: #2a1a0b;
    --ink-soft: #5a3d1f;
    --ivory: #f8f0db;
    --ivory2: #ecdfbd;
    --leather: #1c3a27;
    --leather2: #12291b;
    --cream-text: #f3e2b8;
    --serif: "Noto Serif", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--serif);
    color: var(--ink);
    background: #24160c url(holz.jpg) center / cover no-repeat;
    -webkit-user-select: none; user-select: none;
  }
  body::before { /* Vignette – dunkle Ränder wie unter Lampenlicht */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 85% 60% at 50% 22%, rgba(255, 214, 140, .16) 0%, rgba(0,0,0,0) 45%, rgba(10, 5, 2, .55) 100%);
  }
  button { font-family: inherit; }

  /* ================= Startseite ================= */
  #home { position: fixed; inset: 0; z-index: 1; overflow: hidden; background: #120a05; }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 768px; height: 1376px;
    transform: translate(-50%, -50%) scale(var(--sx, 1), var(--sy, 1));
    background: url(szene.jpg) 0 0 / 768px 1376px no-repeat;
  }
  .drawer {
    position: absolute; left: 176px; width: 494px; border: 0; padding: 0; cursor: pointer;
    background: transparent; border-radius: 6px; outline: none;
  }
  .drawer:active { background: radial-gradient(ellipse at 50% 40%, rgba(255, 214, 140, .12), rgba(255, 214, 140, 0) 70%); }

  /* ================= Arbeitsbereiche ================= */
  .screen {
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    background: #24160c url(holz.jpg) center / cover no-repeat;
  }
  .screen.open { display: flex; }
  .screen::before { content: ""; position: absolute; inset: 0; background: rgba(15, 8, 3, .45); pointer-events: none; }
  .bar {
    position: relative; z-index: 2; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) 10px 8px;
    background: linear-gradient(180deg, #3a2412, #22140a);
    box-shadow: 0 3px 8px rgba(0,0,0,.6);
    border-bottom: 2px solid #a5792c;
  }
  .bar h2 { flex: 1; min-width: 0; margin: 0; font-size: 18px; color: var(--cream-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .3px; }
  .round {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: var(--brass); color: var(--ink); font-size: 22px; font-weight: bold; line-height: 40px;
    box-shadow: 0 2px 4px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .round:active { filter: brightness(.88); transform: translateY(1px); }
  .round.small { width: 36px; height: 36px; font-size: 19px; line-height: 36px; }
  .body { position: relative; z-index: 1; flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
  .foot {
    position: relative; z-index: 2; flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 10px 10px max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(0deg, #2d1c0e, #22140a); border-top: 2px solid #a5792c;
    box-shadow: 0 -3px 8px rgba(0,0,0,.5);
  }
  .btn {
    flex: 1 1 0; min-width: 0; border: 0; border-radius: 10px; padding: 11px 8px; cursor: pointer;
    background: var(--brass); color: var(--ink); font-size: 15.5px; font-weight: bold; letter-spacing: .2px;
    box-shadow: 0 3px 6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 2px rgba(0,0,0,.25);
    text-shadow: 0 1px 0 rgba(255,255,255,.5); line-height: 1.15;
  }
  .btn.green { background: linear-gradient(160deg, #2f6142, #1c3a27 60%, #12291b); color: var(--cream-text); text-shadow: 0 1px 1px #000; box-shadow: 0 3px 6px rgba(0,0,0,.55), inset 0 0 0 1.5px #b8913f, inset 0 1px 0 rgba(255,255,255,.15); }
  .btn:active { filter: brightness(.88); transform: translateY(1px); }
  .btn:disabled { filter: grayscale(.7) brightness(.7); opacity: .6; }
  .btn.full { flex-basis: 100%; }

  .paper {
    background: linear-gradient(180deg, #fbf6e8, #f3e9d0);
    border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.55);
    color: #1d140b; user-select: text; -webkit-user-select: text;
  }
  .hint { color: var(--cream-text); text-align: center; font-size: 15px; padding: 12px 16px 4px; text-shadow: 0 1px 2px #000; line-height: 1.35; }

  /* Leser */
  #viewBody { padding: 12px 8px 30px; }
  #viewBody.pdf, #viewBody.image { overflow: auto; touch-action: pan-x pan-y; }
  .pages { display: flex; flex-direction: column; align-items: center; gap: 12px; transform-origin: 0 0; }
  .pg { position: relative; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.6); flex-shrink: 0; }
  .pg canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pg .num { position: absolute; right: 6px; bottom: 4px; font: 11px sans-serif; color: #999; }
  #pageInfo { position: absolute; z-index: 3; left: 50%; transform: translateX(-50%); top: 70px; background: rgba(25,15,7,.82); color: var(--cream-text); border: 1px solid #a5792c; border-radius: 14px; padding: 3px 12px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #pageInfo.show { opacity: 1; }
  .img-view { display: flex; justify-content: center; }
  .img-view img { max-width: none; box-shadow: 0 4px 14px rgba(0,0,0,.6); background: #fff; }
  .doc { margin: 0 auto; max-width: 820px; padding: 22px 18px 30px; font-size: calc(16px * var(--fz, 1)); line-height: 1.5; font-family: Georgia, "Noto Serif", serif; word-wrap: break-word; }
  .doc.book { font-size: calc(18px * var(--fz, 1)); line-height: 1.6; text-align: justify; hyphens: auto; }
  .doc p { margin: 0 0 .45em; }
  .doc p.li { position: relative; padding-left: 1.1em; }
  .doc p.li .mark { position: absolute; left: 0; }
  .doc h1, .doc h2, .doc h3, .doc h4 { margin: .9em 0 .4em; line-height: 1.25; color: #2a1708; }
  .doc h1 { font-size: 1.55em; } .doc h2 { font-size: 1.3em; } .doc h3 { font-size: 1.12em; } .doc h4 { font-size: 1em; }
  .doc h1.slide-title { border-bottom: 2px solid #b38a3c; padding-bottom: .2em; margin-top: 1.4em; }
  .doc .tbl-wrap { overflow-x: auto; margin: .6em 0; }
  .doc table { border-collapse: collapse; font-size: .85em; font-family: -apple-system, Roboto, sans-serif; }
  .doc td { border: 1px solid #b9a98a; padding: 3px 6px; vertical-align: top; min-width: 2em; }
  .doc table.sheet td { white-space: nowrap; }
  .doc table.sheet tr:first-child td { background: #efe2c2; font-weight: bold; }
  .doc p.img { text-align: center; } .doc p.img img { max-width: 100%; height: auto; }
  .doc .img-missing { color: #8a6a3a; font-style: italic; text-align: center; font-size: .85em; }
  .doc .page-break { border-top: 2px dashed #c9b48a; margin: 1.2em -18px; }
  .doc .chapter-break { text-align: center; color: #a5792c; font-size: 1.3em; margin: 1.2em 0; }
  .doc hr { border: 0; border-top: 1px solid #b9a98a; }

  /* PDF erstellen */
  .name-row { display: flex; align-items: center; gap: 6px; margin: 12px 12px 4px; padding: 8px 10px; }
  .name-row label { font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
  .name-row input { flex: 1; min-width: 0; font: 15px var(--serif); border: 1px solid #b9a07a; border-radius: 6px; padding: 6px 8px; background: #fffdf6; color: var(--ink); user-select: text; }
  .name-row span { font-size: 14px; color: var(--ink-soft); }
  .flist { list-style: none; margin: 8px 12px 20px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .flist li { display: flex; align-items: center; gap: 10px; padding: 8px; }
  .thumb { width: 54px; height: 70px; flex-shrink: 0; border: 1px solid #c5b18a; background: #fff center / contain no-repeat; display: flex; align-items: center; justify-content: center; font: bold 11px sans-serif; color: #fff; border-radius: 2px; overflow: hidden; }
  .thumb canvas { max-width: 100%; max-height: 100%; }
  .finfo { flex: 1; min-width: 0; }
  .finfo b { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .finfo small { font-size: 12.5px; color: var(--ink-soft); }
  .finfo small.err { color: #9b1c0c; }
  .fbtns { display: flex; gap: 4px; flex-shrink: 0; }
  .fbtns button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #a5792c; background: linear-gradient(#fff8e6, #ead9b1); font-size: 16px; color: var(--ink); padding: 0; }
  .fbtns button:active { filter: brightness(.9); }
  .fbtns button:disabled { opacity: .3; }
  .empty { margin: 30px 16px; padding: 26px 18px; text-align: center; }
  .empty p { margin: 0 0 14px; font-size: 15.5px; line-height: 1.45; }

  /* Trennen */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 8px 12px 24px; }
  .gpage { position: relative; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.55); cursor: pointer; border-radius: 2px; outline: 3px solid transparent; outline-offset: 2px; transition: outline-color .15s; }
  .gpage canvas { width: 100%; display: block; }
  .gpage .n { position: absolute; left: 50%; bottom: -1px; transform: translate(-50%, 50%); background: #2a1a0b; color: var(--cream-text); font: bold 12px sans-serif; border-radius: 10px; padding: 2px 8px; border: 1px solid #a5792c; }
  .gpage.sel { outline-color: #e2b75a; }
  .gpage.sel::after { content: "✓"; position: absolute; right: -6px; top: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--brass); color: var(--ink); font: bold 16px/26px sans-serif; text-align: center; box-shadow: 0 2px 4px rgba(0,0,0,.6); }
  .gpage.sel canvas { filter: sepia(.35) brightness(.92); }
  .selbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; color: var(--cream-text); font-size: 14px; }
  .selbar .sp { flex: 1; text-align: center; }
  .selbar button { border: 1px solid #a5792c; background: rgba(30,18,8,.7); color: var(--cream-text); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; }

  /* Unterschrift */
  #signBody { display: flex; justify-content: center; align-items: flex-start; padding: 12px 8px 24px; }
  .sign-page { position: relative; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.6); touch-action: none; }
  .sign-page canvas { display: block; width: 100%; height: 100%; }
  .sig { position: absolute; touch-action: none; cursor: move; }
  .sig img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .sig.live { outline: 2px dashed #b4741c; outline-offset: 3px; background: rgba(255, 230, 160, .18); }
  .sig.live::after { content: "↔ ziehen · 2 Finger: Größe"; position: absolute; left: 50%; top: 100%; transform: translate(-50%, 7px); white-space: nowrap; font: 11px sans-serif; color: #fff; background: rgba(60,35,10,.85); padding: 2px 7px; border-radius: 8px; pointer-events: none; }
  .sig.placed .x { position: absolute; right: -11px; top: -11px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: #8b1d10; color: #fff; font: bold 14px/24px sans-serif; padding: 0; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .sign-tools { position: relative; z-index: 2; flex-shrink: 0; padding: 8px 12px 0; background: linear-gradient(0deg, #2d1c0e, #22140a); border-top: 2px solid #a5792c; color: var(--cream-text); }
  .sig-row { display: flex; align-items: center; gap: 10px; }
  .sig-prev { width: 96px; height: 40px; flex-shrink: 0; border-radius: 6px; border: 1px solid #a5792c; background: #fffdf6 center / contain no-repeat; }
  .size-row { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; font-size: 13.5px; }
  .size-row input { flex: 1; accent-color: #c99a3e; }
  .pager { display: flex; align-items: center; gap: 6px; color: var(--cream-text); font-size: 14px; white-space: nowrap; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .chk input { accent-color: #c99a3e; width: 18px; height: 18px; }

  /* Hinweise und Fenster */
  #busy { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: rgba(12, 6, 2, .72); color: var(--cream-text); font-size: 16px; text-align: center; padding: 20px; }
  #busy.open { display: flex; }
  .spinner { width: 56px; height: 56px; border-radius: 50%; border: 5px solid rgba(201, 154, 62, .25); border-top-color: #e7c574; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 60; max-width: 90%; background: var(--ivory); color: var(--ink); border: 2px solid #b8913f; border-radius: 12px; padding: 8px 14px; font-size: 14.5px; text-align: center; box-shadow: 0 4px 12px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .3s; }
  #toast.show { opacity: 1; }
  .modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(12, 6, 2, .65); padding: 18px; }
  .modal.open { display: flex; }
  .modal-box { width: min(100%, 420px); padding: 4px; border-radius: 14px; background: var(--brass); box-shadow: 0 10px 30px rgba(0,0,0,.7); }
  .modal-in { border-radius: 11px; background: linear-gradient(180deg, #fbf6e8, #efe2c2); padding: 18px 16px 16px; text-align: center; }
  .modal-in h3 { margin: 0 0 8px; font-size: 19px; }
  .modal-in p { margin: 0 0 14px; font-size: 15px; line-height: 1.4; color: #3a2a17; word-break: break-word; }
  .modal-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .modal-btns .btn { flex: 1 1 40%; }
  .err-box { margin: 26px 14px; padding: 22px 18px; text-align: center; font-size: 15.5px; line-height: 1.45; }
  .err-box b { display: block; font-size: 18px; margin-bottom: 8px; color: #7a1a0c; }
</style>
</head>
<body>

<!-- ============ gemeinsame Grafiken ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe9ae"/><stop offset=".25" stop-color="#d1a854"/><stop offset=".5" stop-color="#8a6420"/>
      <stop offset=".72" stop-color="#e7cb7d"/><stop offset="1" stop-color="#a27729"/>
    </linearGradient>
    <linearGradient id="gBrassV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe9ae"/><stop offset=".45" stop-color="#c99d45"/><stop offset=".55" stop-color="#9a7128"/><stop offset="1" stop-color="#e2c272"/>
    </linearGradient>
    <linearGradient id="gShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd39b"/><stop offset=".18" stop-color="#2f9a58"/><stop offset=".6" stop-color="#16673a"/><stop offset="1" stop-color="#0b3d22"/>
    </linearGradient>
    <linearGradient id="gShadeSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".22" stop-color="#000" stop-opacity="0"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#ffe7a6" stop-opacity=".75"/><stop offset=".45" stop-color="#ffd27a" stop-opacity=".22"/><stop offset="1" stop-color="#ffcf70" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gKnob" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff5cc"/><stop offset=".5" stop-color="#c8a04a"/><stop offset="1" stop-color="#6b4a14"/>
    </radialGradient>
    <radialGradient id="gSeal" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e2514a"/><stop offset=".6" stop-color="#a51d17"/><stop offset="1" stop-color="#6a0d09"/>
    </radialGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset=".5" stop-color="#d8ecf3" stop-opacity=".35"/><stop offset="1" stop-color="#9fc3d1" stop-opacity=".5"/>
    </linearGradient>
    <g id="orHalf">
      <path d="M200 22 C186 22 178 12 166 12 C154 12 150 26 160 29 C168 31 171 22 165 19" fill="none" stroke="url(#gBrassV)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M160 22 C140 22 128 33 112 31 C98 29 98 16 108 15 C116 14 117 23 111 24" fill="none" stroke="url(#gBrassV)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M112 22 H34" stroke="url(#gBrassV)" stroke-width="2" stroke-linecap="round"/>
      <path d="M34 22 C26 22 22 15 15 17 C9 19 10 27 16 27 C20 27 21 23 18 21" fill="none" stroke="url(#gBrassV)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="60" cy="22" r="2.4" fill="url(#gKnob)"/><circle cx="84" cy="22" r="2" fill="url(#gKnob)"/>
      <path d="M140 14 l3 -5 l3 5 l-3 3z M140 30 l3 5 l3 -5 l-3 -3z" fill="url(#gBrassV)"/>
    </g>
    <g id="cornerArt">
      <path d="M2 2 H32 C24 6 14 8 10 14 C7 18 6 24 2 32 Z" fill="url(#gBrass)" stroke="#5a3d10" stroke-width=".8"/>
      <circle cx="9" cy="9" r="3" fill="url(#gKnob)" stroke="#4a320c" stroke-width=".5"/>
    </g>
  </defs>
</svg>

<!-- ============ Startseite: Schreibtisch mit vier Schubladen (festes Bild) ============ -->
<div id="home">
  <div id="stage">
    <button class="drawer" id="tRead"   style="top:492px; height:212px" aria-label="Lesen"></button>
    <button class="drawer" id="tCreate" style="top:708px; height:188px" aria-label="PDF bearbeiten"></button>
    <button class="drawer" id="tSplit"  style="top:900px; height:186px" aria-label="PDF teilen"></button>
    <button class="drawer" id="tSign"   style="top:1090px; height:206px" aria-label="Unterschrift"></button>
  </div>
</div>

<!-- ============ Lesen ============ -->
<section class="screen" id="viewer">
  <div class="bar">
    <button class="round" data-back>‹</button>
    <h2 id="viewTitle">Lesen</h2>
    <button class="round small" id="zoomOut">−</button>
    <button class="round small" id="zoomIn">+</button>
  </div>
  <div id="pageInfo"></div>
  <div class="body" id="viewBody"></div>
  <div class="foot" id="viewFoot"></div>
</section>

<!-- ============ PDF erstellen ============ -->
<section class="screen" id="create">
  <div class="bar"><button class="round" data-back>‹</button><h2>PDF bearbeiten</h2></div>
  <div class="body" id="createBody">
    <div class="paper name-row"><label for="outName">Name:</label><input id="outName" type="text" spellcheck="false"><span>.pdf</span></div>
    <div class="hint" id="createHint">Reihenfolge mit ▲ ▼ ändern – so landen die Seiten im PDF.</div>
    <ul class="flist" id="flist"></ul>
    <div class="paper empty" id="createEmpty"><p>Wähle Fotos, PDFs oder andere Dokumente aus.<br>Alles wird automatisch zu <b>einem</b> PDF zusammengefügt.</p><button class="btn" id="createPick">📂 Dateien wählen</button></div>
  </div>
  <div class="foot"><button class="btn green" id="createAdd">＋ Hinzufügen</button><button class="btn" id="createGo" disabled>PDF erstellen</button></div>
</section>

<!-- ============ Trennen ============ -->
<section class="screen" id="split">
  <div class="bar"><button class="round" data-back>‹</button><h2 id="splitTitle">PDF trennen</h2></div>
  <div class="selbar" id="splitSel"><button id="selAll">Alle</button><span class="sp" id="selCount">Tippe die Seiten an</span><button id="selNone">Keine</button></div>
  <div class="body" id="splitBody"><div class="grid" id="grid"></div></div>
  <div class="foot">
    <button class="btn" id="splitExtract" disabled>Auswahl als<br>neues PDF</button>
    <button class="btn" id="splitRemove" disabled>Auswahl<br>entfernen</button>
    <button class="btn green" id="splitEach">Jede Seite<br>einzeln</button>
  </div>
</section>

<!-- ============ Unterschrift ============ -->
<section class="screen" id="sign">
  <div class="bar">
    <button class="round" data-back>‹</button><h2 id="signTitle">Unterschreiben</h2>
    <div class="pager"><button class="round small" id="pgPrev">‹</button><span id="pgLabel">1/1</span><button class="round small" id="pgNext">›</button></div>
  </div>
  <div class="body" id="signBody"><div class="sign-page" id="signPage"><canvas id="signCanvas"></canvas></div></div>
  <div class="sign-tools">
    <div class="sig-row">
      <div class="sig-prev" id="sigPrev"></div>
      <button class="btn green" id="sigChange" style="flex:0 0 auto;padding:9px 12px;font-size:14px">Unterschrift<br>wählen</button>
      <label class="chk"><input type="checkbox" id="sigClean" checked>weißen Hintergrund<br>entfernen</label>
    </div>
    <div class="size-row"><span>Größe</span><button class="round small" id="szMinus">−</button><input type="range" id="sigSize" min="8" max="95" value="34"><button class="round small" id="szPlus">+</button></div>
  </div>
  <div class="foot"><button class="btn green" id="sigPlace">Hier einfügen</button><button class="btn" id="sigSave">Speichern</button></div>
</section>

<!-- ============ Fenster ============ -->
<div class="modal" id="modal"><div class="modal-box"><div class="modal-in">
  <h3 id="mTitle"></h3><p id="mText"></p><div class="modal-btns" id="mBtns"></div>
</div></div></div>
<div id="busy"><div class="spinner"></div><div id="busyText">Bitte warten …</div></div>
<div id="toast"></div>

<input type="file" id="pickAny" style="display:none">
<input type="file" id="pickMany" multiple style="display:none">
<input type="file" id="pickPdf" accept="application/pdf,.pdf" style="display:none">
<input type="file" id="pickImg" accept="image/*" style="display:none">

<script type="module" src="app.js"></script>
</body>
</html>
