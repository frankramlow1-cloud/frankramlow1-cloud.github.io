<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Tag Editor & Converter</title>
  <!-- Bibliotheken für MP3-Erstellung und Tagging -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #121212; color: #E0E0E0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background-color: #1E1E1E; border-radius: 16px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { color: #BB86FC; text-align: center; margin-bottom: 25px; font-weight: 600; }
    .group { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; font-size: 0.9em; color: #A0A0A0; font-weight: 500; }
    input[type="text"] { width: 100%; background: #2C2C2C; border: 1px solid #333; border-radius: 8px; padding: 14px; color: #FFF; font-size: 1em; outline: none; }
    input[type="text"]:focus { border-color: #BB86FC; }
    .file-input-btn { display: block; text-align: center; background: #292929; border: 1px dashed #444; border-radius: 8px; padding: 14px; cursor: pointer; color: #BB86FC; font-weight: bold; transition: 0.2s; }
    .file-input-btn:hover { background: #333; }
    input[type="file"] { display: none; }
    #cover-preview { width: 140px; height: 140px; margin: 15px auto 0; border-radius: 8px; background: #121212; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #333; color: #555; }
    #cover-preview img { width: 100%; height: 100%; object-fit: cover; }
    .btn-save { width: 100%; background: #03DAC6; color: #000; border: none; border-radius: 8px; padding: 16px; font-size: 1.05em; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-save:hover { background: #00E5D1; }
    .btn-save:disabled { background: #555; cursor: not-allowed; color: #888; }
    .file-name { font-size: 0.85em; color: #03DAC6; margin-top: 6px; text-align: center; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Clean Tag Editor</h2>

    <div class="group">
      <label>1. Audio-Datei (MP3, M4A, WAV)</label>
      <label for="audio-file" class="file-input-btn">🎵 Audio-Datei wählen</label>
      <input type="file" id="audio-file" accept="audio/*">
      <div id="audio-name" class="file-name"></div>
    </div>

    <div class="group">
      <label>2. Neues Cover-Bild</label>
      <label for="cover-file" class="file-input-btn">🖼️ Bild wählen</label>
      <input type="file" id="cover-file" accept="image/jpeg, image/png">
      <div id="cover-preview">Kein Cover</div>
    </div>

    <div class="group">
      <label>3. Neuer Lied-Titel (Einziges Feld)</label>
      <input type="text" id="song-title" placeholder="Titel hier eingeben...">
    </div>

    <button id="save-btn" class="btn-save" onclick="processAndSave()">🔥 Alt-Tags löschen & Speichern</button>
  </div>

  <script>
    let selectedFile = null;
    let coverBuffer = null;
    let coverMime = '';

    document.getElementById('audio-file').addEventListener('change', (e) => {
      selectedFile = e.target.files[0];
      if (!selectedFile) return;
      document.getElementById('audio-name').innerText = selectedFile.name;
    });

    document.getElementById('cover-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      coverMime = file.type;
      coverBuffer = await file.arrayBuffer();
      const imgUrl = URL.createObjectURL(file);
      document.getElementById('cover-preview').innerHTML = `<img src="${imgUrl}">`;
    });

    async function processAndSave() {
      if (!selectedFile) {
        alert("Bitte zuerst eine Audio-Datei auswählen!");
        return;
      }

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.innerText = "⏳ Wird verarbeitet (Bitte warten)...";

      try {
        const title = document.getElementById('song-title').value.trim();
        let finalMp3Buffer;

        if (selectedFile.name.toLowerCase().endsWith('.mp3')) {
          // Ist bereits MP3, einfach durchreichen
          finalMp3Buffer = await selectedFile.arrayBuffer();
        } else {
          // Ist ein anderes Format, umwandeln zu MP3
          finalMp3Buffer = await convertToMp3(selectedFile);
        }

        // Sauberes Tag schreiben
        const writer = new ID3Writer(finalMp3Buffer);
        if (title) writer.setFrame('TIT2', title);
        if (coverBuffer) {
          writer.setFrame('APIC', {
            type: 3,
            data: coverBuffer,
            description: 'Cover',
            mimeType: coverMime
          });
        }
        writer.addTag();
        
        // Neuen Dateinamen generieren
        let outName = selectedFile.name.replace(/\.[^/.]+$/, "") + ".mp3";
        downloadBlob(writer.getBlob(), "clean_" + outName);

      } catch (err) {
        alert("Fehler beim Verarbeiten: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "🔥 Alt-Tags löschen & Speichern";
      }
    }

    async function convertToMp3(file) {
      // Nutzt den Browser, um die Datei zu dekodieren
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await file.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

      const channels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      
      // Lamejs MP3 Encoder mit 192 kbps initialisieren
      const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 192);
      const mp3Data = [];

      const left = audioBuffer.getChannelData(0);
      const right = channels > 1 ? audioBuffer.getChannelData(1) : left;
      const sampleBlockSize = 1152;

      // Konvertierung von Float32 zu Int16 für Lamejs
      const floatToInt = (arr) => {
        const res = new Int16Array(arr.length);
        for (let i = 0; i < arr.length; i++) {
          let s = Math.max(-1, Math.min(1, arr[i]));
          res[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return res;
      };

      const leftInt = floatToInt(left);
      const rightInt = floatToInt(right);

      // In Blöcken encodieren
      for (let i = 0; i < leftInt.length; i += sampleBlockSize) {
        const leftChunk = leftInt.subarray(i, i + sampleBlockSize);
        const rightChunk = rightInt.subarray(i, i + sampleBlockSize);
        const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
        if (mp3buf.length > 0) {
          mp3Data.push(mp3buf);
        }
      }
      
      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) {
        mp3Data.push(mp3buf);
      }

      // MP3 Blob zurück in ArrayBuffer verwandeln für den Tag-Writer
      const finalBlob = new Blob(mp3Data, { type: 'audio/mp3' });
      return await finalBlob.arrayBuffer();
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    }
  </script>
</body>
</html>
